# Copy to ~/.config/vivus/config.toml.
# Each role names a provider (and usually a model). Switch providers by editing
# this file only.
#
# API keys never go in this file: set them in the Settings window (or
# `vivusctl settings key <provider> --set`), which saves them in the system
# keyring, or ~/.config/vivus/.env without one. An environment variable named
# by api_key_env (default <NAME>_API_KEY) wins over a saved key.

# Remote APIs (OpenAI-compatible), by name; the Settings window adds them with
# presets. Roles refer to them by name.
[providers.groq]
base_url = "https://api.groq.com/openai/v1"

# OpenAI-compatible aggregator with most models (https://docs.nano-gpt.com).
[providers.nano-gpt]
base_url = "https://nano-gpt.com/api/v1"
# The key's variable in the environment and .env (default NANO_GPT_API_KEY).
api_key_env = "NANOGPT_API_KEY"

# Local speech models (`vivusctl models fetch` downloads them), used by the
# stt and tts roles.
[speech]
# models_dir = "~/.local/share/vivus/models"
threads = 2

# Headless Claude Code (`claude -p`), always available to the answer and agent
# roles as provider "claude-code". It runs in your home directory and can't ask
# for permission, so only the tools listed in args are allowed beyond
# read-only ones.
[claude_code]
command = "claude"
args = ["--allowedTools", "WebSearch,WebFetch"]

# Speech roles run locally and name no provider.
# Unset stt means parakeet-tdt-110m.
# Models: parakeet-tdt-110m (light), parakeet-tdt-0.6b (standard),
# nemotron-streaming-0.6b (streaming, no punctuation).
[roles.stt]
model = "parakeet-tdt-110m"

# Unset tts means kitten-nano.
# Models and voices: kitten-nano (light; bella, jasper, luna, bruno, rosie,
# hugo, kiki, leo), kokoro (standard; af_heart, af_bella, am_michael, bf_emma, ...).
[roles.tts]
model = "kokoro"
voice = "af_heart"

# The router's model also looks up pronunciations for words the TTS lexicon
# lacks; answers are cached in ~/.local/share/vivus/pronunciations.txt.
[roles.router]
provider = "groq"
model = "<fast-model>"

# Escalation targets. agent falls back to answer if unset. model is optional
# for claude-code (e.g. "sonnet", "opus").
[roles.answer]
provider = "groq"
model = "<mid-tier-model>"

[roles.agent]
provider = "claude-code"
# model = "sonnet"

[audio]
# input = "alsa_input.pci-0000_00_1f.3.analog-stereo"
# output = "alsa_output.pci-0000_00_1f.3.analog-stereo"
end_of_turn_silence = 0.4
# Cancels whatever `output` (or the default sink) plays, so you can interrupt
# replies by talking, even with music on. It costs some recognition accuracy
# while music plays. Turn off if `input` is already echo-cancelled; the mic is
# then paused while speaking.
echo_cancel = true
# Keep the mic running between listens (audio is dropped until you talk).
# Onboard inputs often thump and miss the first second or so when they wake
# from suspend. The desktop's mic-in-use indicator, if any, stays on.
keep_mic_open = true
# Other apps' volume (music, videos) while vivus speaks or you talk to it,
# relative to their own; 1.0 leaves them alone. Your mixer's volumes for them
# are left untouched.
duck_volume = 0.3
# Our speech volume as a mixer shows it (0 to 1); speech is levelled to about
# -16 LUFS first. Setting the app's volume in a mixer doesn't change this.
speech_volume = 1.0
# Save each utterance as the recognizer heard it (after echo cancellation) to
# ~/.local/share/vivus/recordings, with transcripts.tsv. For debugging accuracy.
record_utterances = false

# Follow-ups ("what about tomorrow?", "add milk to that list") need the
# conversation so far. Only the last max_turns exchanges are sent, shortened to
# fit a fixed budget, and the conversation starts over after a quiet spell.
[conversation]
max_turns = 10
forget_after_minutes = 10

# Global shortcuts, requested from the desktop's GlobalShortcuts portal at
# startup (shortcuts-spec format). "" leaves one unbound. On desktops whose
# portal asks you to confirm or pick keys, these are only suggestions. Without
# the portal, bind vivusctl commands to keys in your compositor instead.
[shortcuts]
push_to_talk = "LOGO+space"
toggle_listen = "LOGO+SHIFT+space"
toggle_sidebar = "LOGO+v"

[debug]
# Transcribe what you say but don't answer it (no LLM call, no speech), to
# test recognition quickly. Pairs well with [audio] record_utterances.
transcribe_only = false
