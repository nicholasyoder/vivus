# Copy to ~/.config/vivus/config.toml.
# Each role names a provider (and usually a model). Switch providers by editing
# this file only.
#
# API keys (api_key_env) are read from the environment, then from
# ~/.config/vivus/.env as KEY=value lines. chmod 600 that file.

[providers.groq]
kind = "openai-compatible"
base_url = "https://api.groq.com/openai/v1"
api_key_env = "GROQ_API_KEY"

# OpenAI-compatible aggregator with most models (https://docs.nano-gpt.com).
[providers.nano-gpt]
kind = "openai-compatible"
base_url = "https://nano-gpt.com/api/v1"
api_key_env = "NANOGPT_API_KEY"

# Local speech models (scripts/fetch-models.sh downloads them).
[providers.local-speech]
kind = "local-speech"
# models_dir = "~/.local/share/vivus/models"
threads = 2

# Headless Claude Code (`claude -p`), run in your home directory. It can't ask
# for permission, so only the tools listed in args are allowed beyond read-only ones.
[providers.claude-code]
kind = "claude-code"
command = "claude"
args = ["--allowedTools", "WebSearch,WebFetch"]

# Unset stt defaults to local-speech with parakeet-tdt-110m.
# Models: parakeet-tdt-110m (light), nemotron-streaming-0.6b (standard).
[roles.stt]
provider = "local-speech"
model = "parakeet-tdt-110m"

# Unset tts defaults to local-speech with kitten-nano.
# Models and voices: kitten-nano (light; bella, jasper, luna, bruno, rosie,
# hugo, kiki, leo), kokoro (standard; af_heart, af_bella, am_michael, bf_emma, ...).
[roles.tts]
provider = "local-speech"
model = "kokoro"
voice = "af_heart"

# The router's model also looks up pronunciations for words the TTS lexicon
# lacks; answers are cached in ~/.local/share/vivus/pronunciations.txt.
[roles.router]
provider = "groq"
model = "<fast-model>"

# Escalation targets. agent falls back to answer if unset. model is optional
# for claude-code (e.g. "sonnet", "opus").
[roles.answer]
provider = "groq"
model = "<mid-tier-model>"

[roles.agent]
provider = "claude-code"
# model = "sonnet"

[audio]
# input = "alsa_input.pci-0000_00_1f.3.analog-stereo"
# output = "alsa_output.pci-0000_00_1f.3.analog-stereo"
end_of_turn_silence = 0.4
# Cancels whatever `output` (or the default sink) plays, so you can interrupt
# replies by talking, even with music on. Turn off if `input` is already
# echo-cancelled; the mic is then paused while speaking.
echo_cancel = true
# Other apps' volume (music, videos) while vivus speaks, relative to their own;
# 1.0 leaves them alone. Your mixer's volumes for them are left untouched.
duck_volume = 0.3
